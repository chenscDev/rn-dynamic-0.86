<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RN 分包打包管理</title>
  <style>
    :root {
      --bg: #f4f5f7; --panel: #fff; --text: #1a1a1a; --muted: #667085;
      --line: #e4e7ec; --accent: #175cd3; --ok: #067647; --bad: #b42318;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 20px 24px; background: #101828; color: #fff; }
    header h1 { margin: 0 0 6px; font-size: 20px; }
    header p { margin: 0; color: #d0d5dd; font-size: 13px; }
    main { max-width: 1120px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .panel h2 { margin: 0 0 12px; font-size: 15px; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    textarea { min-height: 140px; font-family: var(--mono); font-size: 12px; line-height: 1.45; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; background: var(--accent); color: #fff; cursor: pointer; }
    button.secondary { background: #fff; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: #b42318; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .checks { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 8px; font-size: 13px; }
    .checks label { display: flex; align-items: center; gap: 6px; color: var(--text); }
    .meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .status { font-size: 13px; font-weight: 600; }
    .status.running { color: var(--accent); }
    .status.success { color: var(--ok); }
    .status.failed { color: var(--bad); }
    details.log-panel { border: 1px solid var(--line); border-radius: 12px; background: #0b1220; color: #e5e7eb; overflow: hidden; }
    details.log-panel > summary { cursor: pointer; padding: 12px 14px; list-style: none; display: flex; justify-content: space-between; background: #111827; }
    details.log-panel > summary::-webkit-details-marker { display: none; }
    .log-body { margin: 0; padding: 12px 14px 16px; max-height: 420px; overflow: auto; font-family: var(--mono); font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .project-list { display: grid; gap: 8px; margin-top: 8px; }
    .project-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .project-item.active { border-color: var(--accent); background: #eff8ff; }
    .project-item button { padding: 6px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>RN 分包打包管理</h1>
    <p>同一 RN 0.86 工程可新增多个分支项目；分别配置测试/线上并打包管理</p>
  </header>
  <main>
    <section class="panel">
      <h2>项目列表（同工程 · 多分支）</h2>
      <div class="project-list" id="projectList"></div>
      <div class="row" style="margin-top:12px">
        <label>新项目名称<input id="newName" placeholder="例如 支付改版" /></label>
        <label>绑定分支<input id="newBranch" placeholder="例如 ff-cc / feature/pay" /></label>
        <label>项目 ID（可选）<input id="newId" placeholder="默认取规范化分支名" /></label>
      </div>
      <div class="actions">
        <button id="addProjectBtn">新增分支项目</button>
        <button class="secondary" id="reloadBtn">刷新</button>
      </div>
      <p class="hint" id="metaHint"></p>
    </section>

    <section class="panel">
      <h2>构建参数</h2>
      <div class="row">
        <label>当前项目<select id="projectSelect"></select></label>
        <label>目标环境<select id="envSelect"><option value="test">测试</option><option value="production">线上</option></select></label>
        <label>构建分支（可覆盖项目默认）<input id="branchOverride" placeholder="留空则用项目绑定分支" /></label>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="actPack" checked /> 打包 common + pages</label>
        <label><input type="checkbox" id="actPublish" /> 发布到 CDN/本地</label>
        <label><input type="checkbox" id="actEmbed" checked /> 嵌入 APK assets</label>
        <label><input type="checkbox" id="actApk" checked /> 构建 APK</label>
      </div>
      <div class="actions">
        <button id="startBtn">开始构建</button>
        <span id="jobStatus" class="status"></span>
      </div>
    </section>

    <section class="panel">
      <h2>当前项目 · 环境配置</h2>
      <div class="row">
        <label>编辑环境<select id="editEnvSelect"><option value="test">测试</option><option value="production">线上</option></select></label>
        <label>包名称 packageName<input id="cfgPackageName" /></label>
        <label>Provider（local / cdn）<input id="cfgProvider" /></label>
        <label>CDN / Base URL<input id="cfgBaseUrl" /></label>
        <label>分包 keys（逗号分隔）<input id="cfgPageKeys" /></label>
      </div>
      <label style="margin-top:12px">CDN 扩展 JSON<textarea id="cfgCdnJson"></textarea></label>
      <div class="actions">
        <button id="saveCfgBtn">保存环境配置</button>
        <span id="cfgSaveHint" class="meta"></span>
      </div>
    </section>

    <details class="log-panel" id="logPanel" open>
      <summary>
        <span>构建实时输出</span>
        <span id="logSummary" class="meta" style="color:#9ca3af">待命</span>
      </summary>
      <pre class="log-body" id="logBody">等待任务…</pre>
    </details>
  </main>

  <script>
    let meta = null;
    let eventSource = null;
    const $ = id => document.getElementById(id);

    function currentProject() {
      const id = $('projectSelect').value;
      return (meta?.projects || []).find(p => p.id === id) || null;
    }

    function renderProjects() {
      const list = $('projectList');
      const sel = $('projectSelect');
      list.innerHTML = '';
      sel.innerHTML = '';
      const projects = meta?.projects || [];
      if (!projects.length) {
        list.innerHTML = '<div class="meta">暂无项目，请先新增</div>';
        return;
      }
      const activeId = sel.value || projects[0].id;
      projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.name} · ${p.branch}`;
        if (p.id === activeId) opt.selected = true;
        sel.appendChild(opt);

        const row = document.createElement('div');
        row.className = 'project-item' + (p.id === activeId ? ' active' : '');
        row.innerHTML = `<div><strong>${p.name}</strong><div class="meta">id=${p.id} · branch=${p.branch} · rn=${p.rnVersion || '0.86.0'}</div></div>`;
        const actions = document.createElement('div');
        actions.style.display = 'flex';
        actions.style.gap = '6px';
        const useBtn = document.createElement('button');
        useBtn.className = 'secondary';
        useBtn.textContent = '选用';
        useBtn.onclick = () => { $('projectSelect').value = p.id; onProjectChange(); renderProjects(); };
        const delBtn = document.createElement('button');
        delBtn.className = 'danger';
        delBtn.textContent = '删除';
        delBtn.onclick = async () => {
          if (!confirm(`删除项目 ${p.name}?`)) return;
          await fetch('/api/projects/' + encodeURIComponent(p.id), { method: 'DELETE' });
          await reloadMeta();
        };
        actions.append(useBtn, delBtn);
        row.appendChild(actions);
        list.appendChild(row);
      });
    }

    function loadEnvEditor() {
      const project = currentProject();
      if (!project) return;
      const envKey = $('editEnvSelect').value;
      const cfg = project.environments?.[envKey] || {};
      $('cfgPackageName').value = cfg.packageName || '';
      $('cfgProvider').value = cfg.provider || 'local';
      $('cfgBaseUrl').value = cfg.baseUrl || '';
      $('cfgPageKeys').value = (cfg.pageKeys || []).join(', ');
      $('cfgCdnJson').value = JSON.stringify(cfg.cdn || {}, null, 2);
      $('branchOverride').placeholder = `默认 ${project.branch}`;
    }

    function onProjectChange() {
      loadEnvEditor();
    }

    async function reloadMeta() {
      const res = await fetch('/api/meta');
      meta = await res.json();
      renderProjects();
      loadEnvEditor();
      $('metaHint').textContent =
        `host @ ${meta.hostBranch}；biz @ ${meta.bizBranch || '-'}；可管理 ${(meta.projects || []).length} 个分支项目`;
    }

    function appendLog(line) {
      const el = $('logBody');
      if (el.textContent === '等待任务…') el.textContent = '';
      el.textContent += (el.textContent ? '\n' : '') + line;
      el.scrollTop = el.scrollHeight;
    }

    function setStatus(status, text) {
      const el = $('jobStatus');
      el.className = 'status ' + (status || '');
      el.textContent = text || '';
      $('logSummary').textContent = text || '待命';
    }

    function startStream(jobId) {
      if (eventSource) eventSource.close();
      $('logBody').textContent = '';
      eventSource = new EventSource(`/api/jobs/${jobId}/stream`);
      eventSource.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'log') appendLog(msg.line);
        if (msg.type === 'hello') setStatus(msg.status, `任务 ${jobId} · ${msg.status}`);
        if (msg.type === 'done') {
          setStatus(msg.status, `任务 ${jobId} · ${msg.status}`);
          $('startBtn').disabled = false;
          eventSource.close();
        }
      };
      eventSource.onerror = () => {
        setStatus('failed', `任务 ${jobId} · 日志连接中断`);
        $('startBtn').disabled = false;
      };
    }

    $('projectSelect').onchange = () => { onProjectChange(); renderProjects(); };
    $('editEnvSelect').onchange = loadEnvEditor;
    $('envSelect').onchange = () => { $('editEnvSelect').value = $('envSelect').value; loadEnvEditor(); };
    $('reloadBtn').onclick = () => reloadMeta().catch(e => alert(e.message));

    $('addProjectBtn').onclick = async () => {
      const branch = $('newBranch').value.trim();
      if (!branch) return alert('请填写分支');
      const res = await fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: $('newName').value.trim() || `${branch} 项目`,
          branch,
          id: $('newId').value.trim() || undefined,
        }),
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error || '新增失败');
      $('newName').value = '';
      $('newBranch').value = '';
      $('newId').value = '';
      await reloadMeta();
      $('projectSelect').value = data.project.id;
      onProjectChange();
      renderProjects();
    };

    $('saveCfgBtn').onclick = async () => {
      const project = currentProject();
      if (!project) return alert('请先选择项目');
      let cdn = {};
      try { cdn = JSON.parse($('cfgCdnJson').value || '{}'); }
      catch { return alert('CDN JSON 格式错误'); }
      const envKey = $('editEnvSelect').value;
      project.environments = project.environments || {};
      project.environments[envKey] = {
        ...(project.environments[envKey] || {}),
        packageName: $('cfgPackageName').value.trim(),
        provider: $('cfgProvider').value.trim() || 'local',
        baseUrl: $('cfgBaseUrl').value.trim(),
        pageKeys: $('cfgPageKeys').value.split(',').map(s => s.trim()).filter(Boolean),
        cdn,
      };
      const res = await fetch('/api/projects', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projects: meta.projects }),
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error || '保存失败');
      $('cfgSaveHint').textContent = `已保存 ${project.id}/${envKey} @ ${new Date().toLocaleTimeString()}`;
    };

    $('startBtn').onclick = async () => {
      const project = currentProject();
      if (!project) return alert('请先选择项目');
      const actions = [];
      if ($('actPack').checked) actions.push('pack');
      if ($('actPublish').checked) actions.push('publish');
      if ($('actEmbed').checked) actions.push('embed');
      if ($('actApk').checked) actions.push('apk');
      if (!actions.length) return alert('请至少勾选一个动作');
      $('startBtn').disabled = true;
      setStatus('running', '启动中…');
      $('logPanel').open = true;
      const res = await fetch('/api/jobs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          projectId: project.id,
          env: $('envSelect').value,
          branch: $('branchOverride').value.trim() || project.branch,
          actions,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || '启动失败');
        $('startBtn').disabled = false;
        return;
      }
      setStatus('running', `任务 ${data.id} · channel=${data.channel}`);
      startStream(data.id);
    };

    reloadMeta().catch(err => { $('metaHint').textContent = '加载失败: ' + err.message; });
  </script>
</body>
</html>
